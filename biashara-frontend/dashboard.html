<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard &middot; Biashara Inventory System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div class="app-shell" id="appShell"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const currentUser = BiasharaDB.getCurrentUser();
    const isOwner = currentUser && currentUser.role === "Owner";

    const content = Biashara.mountShell({
      active: "dashboard",
      title: "Dashboard",
      subtitle: isOwner ? "Today's snapshot of your business" : `Welcome back, ${currentUser ? currentUser.name.split(" ")[0] : ""}`,
    });

    // mountShell() returns null and redirects to index.html if there's
    // no valid session, so bail out of the rest of this page's script.
    if (!content) {
      // redirecting...
    } else {

    function stockPill(p) {
      if (BiasharaDB.isCritical(p)) return `<span class="pill pill-danger"><span class="pill-dot"></span>Critical</span>`;
      if (BiasharaDB.isLowStock(p)) return `<span class="pill pill-warning"><span class="pill-dot"></span>Low</span>`;
      return `<span class="pill pill-success"><span class="pill-dot"></span>Healthy</span>`;
    }

    async function renderOwnerDashboard() {
      let products, lowStock, sales, todayTotal, bestSellers, users;
      try {
        [products, lowStock, sales, todayTotal, bestSellers, users] = await Promise.all([
          BiasharaDB.getProducts(),
          BiasharaDB.getLowStockProducts(),
          BiasharaDB.getSales(),
          BiasharaDB.getTodaySalesTotal(),
          BiasharaDB.getBestSellers(5),
          BiasharaDB.getUsers(),
        ]);
      } catch (err) {
        content.innerHTML = `<div class="empty-state"><div class="icon">&#9888;</div>Could not load the dashboard: ${Biashara.escapeHtml(err.message)}</div>`;
        return;
      }

    content.innerHTML = `
      <div class="row g-3 mb-3">
        <div class="col-6 col-lg-3">
          <div class="stat-tile">
            <div class="icon-badge">&#128176;</div>
            <div class="label">Sales Today</div>
            <div class="value">${Biashara.formatKES(todayTotal)}</div>
            <div class="delta text-muted">${sales.filter(s => s.date.startsWith(new Date().toISOString().slice(0,10))).length} transaction(s) recorded</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-tile">
            <div class="icon-badge">&#128230;</div>
            <div class="label">Products Tracked</div>
            <div class="value">${products.length}</div>
            <div class="delta text-muted">across ${new Set(products.map(p=>p.category)).size} categories</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-tile alert">
            <div class="icon-badge" style="background:var(--biashara-danger-bg); color:var(--biashara-danger);">&#9888;</div>
            <div class="label">Low-Stock Alerts</div>
            <div class="value">${lowStock.length}</div>
            <div class="delta text-muted">at or below reorder level</div>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="stat-tile">
            <div class="icon-badge">&#128101;</div>
            <div class="label">Active Users</div>
            <div class="value">${users.length}</div>
            <div class="delta text-muted">owner + attendants</div>
          </div>
        </div>
      </div>

      <div class="row g-3">
        <div class="col-lg-7">
          <div class="panel mb-3">
            <div class="panel-header">
              <h2>Low-Stock Alerts</h2>
              <a href="reports.html" class="small">View full report &rarr;</a>
            </div>
            <div class="panel-body p-0">
              ${lowStock.length === 0 ? `
                <div class="empty-state">
                  <div class="icon">&#9989;</div>
                  All products are above their reorder level.
                </div>` : `
                <table class="table-biashara">
                  <thead><tr><th>Product</th><th>In Stock</th><th>Reorder Level</th><th>Status</th></tr></thead>
                  <tbody>
                    ${lowStock.map(p => `
                      <tr class="${BiasharaDB.isCritical(p) ? 'row-critical' : 'row-low'}">
                        <td>${Biashara.escapeHtml(p.name)}</td>
                        <td>${p.quantityInStock}</td>
                        <td>${p.reorderLevel}</td>
                        <td>${stockPill(p)}</td>
                      </tr>`).join("")}
                  </tbody>
                </table>`}
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <h2>Recent Sales</h2>
              <a href="sales.html" class="small">Record a sale &rarr;</a>
            </div>
            <div class="panel-body p-0">
              <table class="table-biashara">
                <thead><tr><th>Date</th><th>Recorded By</th><th>Items</th><th>Total</th></tr></thead>
                <tbody>
                  ${sales.slice(0, 5).map(s => `
                    <tr>
                      <td>${s.date}</td>
                      <td>${s.user ? Biashara.escapeHtml(s.user.name) : "—"}</td>
                      <td>${s.items.length} item(s)</td>
                      <td>${Biashara.formatKES(s.total)}</td>
                    </tr>`).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="panel">
            <div class="panel-header"><h2>Best-Selling Products</h2></div>
            <div class="panel-body p-0">
              <table class="table-biashara">
                <thead><tr><th>Product</th><th>Units Sold</th></tr></thead>
                <tbody>
                  ${bestSellers.map(b => `
                    <tr>
                      <td>${b.product ? Biashara.escapeHtml(b.product.name) : "—"}</td>
                      <td>${b.qty}</td>
                    </tr>`).join("")}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    `;
    }

    // The Attendant home screen is deliberately simpler and non-financial:
    // no revenue figures, no user counts — just what they need to do their
    // job (make sales, receive stock) and what's running low.
    async function renderAttendantDashboard() {
      let lowStock, sales;
      try {
        [lowStock, sales] = await Promise.all([
          BiasharaDB.getLowStockProducts(),
          BiasharaDB.getSales(),
        ]);
      } catch (err) {
        content.innerHTML = `<div class="empty-state"><div class="icon">&#9888;</div>Could not load the dashboard: ${Biashara.escapeHtml(err.message)}</div>`;
        return;
      }

      const today = new Date().toISOString().slice(0, 10);
      const mySalesToday = sales.filter(s => s.userId === currentUser.id && s.date.startsWith(today));
      const myItemsToday = mySalesToday.reduce((sum, s) => sum + s.items.reduce((a, i) => a + i.quantitySold, 0), 0);

      content.innerHTML = `
        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <a href="sales.html" class="panel d-block text-decoration-none" style="padding:1.5rem; text-align:center;">
              <div style="font-size:2rem;">&#128179;</div>
              <div class="fw-semibold mt-2" style="color:var(--biashara-teal-700); font-size:1.1rem;">Record a Sale</div>
              <div class="text-muted small">Ring up a customer's items</div>
            </a>
          </div>
          <div class="col-sm-6">
            <a href="stock-receipts.html" class="panel d-block text-decoration-none" style="padding:1.5rem; text-align:center;">
              <div style="font-size:2rem;">&#128666;</div>
              <div class="fw-semibold mt-2" style="color:var(--biashara-teal-700); font-size:1.1rem;">Receive Stock</div>
              <div class="text-muted small">Log new stock as it arrives</div>
            </a>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-sm-6">
            <div class="stat-tile">
              <div class="icon-badge">&#128176;</div>
              <div class="label">Your Sales Today</div>
              <div class="value">${mySalesToday.length}</div>
              <div class="delta text-muted">${myItemsToday} item(s) sold</div>
            </div>
          </div>
          <div class="col-sm-6">
            <div class="stat-tile alert">
              <div class="icon-badge" style="background:var(--biashara-danger-bg); color:var(--biashara-danger);">&#9888;</div>
              <div class="label">Low-Stock Alerts</div>
              <div class="value">${lowStock.length}</div>
              <div class="delta text-muted">at or below reorder level</div>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2>Products Running Low</h2></div>
          <div class="panel-body p-0">
            ${lowStock.length === 0 ? `
              <div class="empty-state">
                <div class="icon">&#9989;</div>
                All products are above their reorder level.
              </div>` : `
              <table class="table-biashara">
                <thead><tr><th>Product</th><th>In Stock</th><th>Status</th></tr></thead>
                <tbody>
                  ${lowStock.map(p => `
                    <tr class="${BiasharaDB.isCritical(p) ? 'row-critical' : 'row-low'}">
                      <td>${Biashara.escapeHtml(p.name)}</td>
                      <td>${p.quantityInStock}</td>
                      <td>${stockPill(p)}</td>
                    </tr>`).join("")}
                </tbody>
              </table>`}
          </div>
        </div>
      `;
    }

    content.innerHTML = `<div class="text-center text-muted py-5">Loading...</div>`;
    if (isOwner) {
      renderOwnerDashboard();
    } else {
      renderAttendantDashboard();
    }
    }
  </script>
</body>
</html>
