<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Record a Sale &middot; Biashara Inventory System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div class="app-shell" id="appShell"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const content = Biashara.mountShell({
      active: "sales",
      title: "Record a Sale",
      subtitle: "Add items to the cart, then complete the sale",
    });

    // mountShell() returns null and redirects to index.html if there's
    // no valid session, so bail out of the rest of this page's script.
    if (!content) {
      // redirecting...
    } else {

    let cart = []; // [{ productId, quantitySold }]
    let searchTerm = "";
    let allProducts = [];

    function findProduct(id) {
      return allProducts.find((p) => p.id === Number(id));
    }

    function cartTotal() {
      return cart.reduce((sum, item) => {
        const p = findProduct(item.productId);
        return sum + (p ? p.unitPrice * item.quantitySold : 0);
      }, 0);
    }

    async function loadProducts() {
      try {
        allProducts = await BiasharaDB.getProducts();
      } catch (err) {
        content.innerHTML = `<div class="empty-state"><div class="icon">&#9888;</div>Could not load products: ${Biashara.escapeHtml(err.message)}</div>`;
        throw err;
      }
    }

    function render() {
      const products = allProducts.filter(p =>
        p.name.toLowerCase().includes(searchTerm.toLowerCase()));

      content.innerHTML = `
        <div class="row g-3">
          <div class="col-lg-7">
            <div class="panel">
              <div class="panel-header"><h2>Choose Products</h2></div>
              <div class="panel-body">
                <input type="search" class="form-control mb-3" id="searchInput" placeholder="Search products..." value="${Biashara.escapeHtml(searchTerm)}">
                <div class="row g-2">
                  ${products.map(p => `
                    <div class="col-sm-6 col-lg-4">
                      <button class="btn btn-outline-biashara w-100 h-100 text-start p-2 add-to-cart-btn" data-id="${p.id}"
                        ${p.quantityInStock <= 0 ? "disabled" : ""} style="font-size:0.85rem;">
                        <div class="fw-semibold">${Biashara.escapeHtml(p.name)}</div>
                        <div class="text-muted small">${Biashara.formatKES(p.unitPrice)} &middot; ${p.quantityInStock} in stock</div>
                      </button>
                    </div>`).join("")}
                </div>
                ${products.length === 0 ? `<div class="empty-state"><div class="icon">&#128269;</div>No products match your search.</div>` : ""}
              </div>
            </div>
          </div>

          <div class="col-lg-5">
            <div class="panel">
              <div class="panel-header"><h2>Current Sale</h2></div>
              <div class="panel-body p-0">
                ${cart.length === 0 ? `
                  <div class="empty-state"><div class="icon">&#128722;</div>Cart is empty. Tap a product to add it.</div>` : `
                  <table class="table-biashara">
                    <thead><tr><th>Item</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead>
                    <tbody>
                      ${cart.map((item, idx) => {
                        const p = findProduct(item.productId);
                        return `
                        <tr>
                          <td>${Biashara.escapeHtml(p.name)}</td>
                          <td>
                            <div class="d-flex align-items-center gap-1">
                              <button class="btn btn-sm btn-outline-biashara qty-btn" data-idx="${idx}" data-delta="-1">&minus;</button>
                              <span>${item.quantitySold}</span>
                              <button class="btn btn-sm btn-outline-biashara qty-btn" data-idx="${idx}" data-delta="1">+</button>
                            </div>
                          </td>
                          <td>${Biashara.formatKES(p.unitPrice * item.quantitySold)}</td>
                          <td><button class="btn btn-sm btn-outline-danger remove-btn" data-idx="${idx}">&times;</button></td>
                        </tr>`;
                      }).join("")}
                    </tbody>
                  </table>`}
              </div>
              <div class="panel-body border-top">
                <div class="d-flex justify-content-between mb-3">
                  <span class="fw-semibold">Total</span>
                  <span class="fw-bold" style="font-family:var(--font-mono); font-size:1.2rem;">${Biashara.formatKES(cartTotal())}</span>
                </div>
                <button class="btn btn-amber w-100 py-2" id="completeSaleBtn" ${cart.length === 0 ? "disabled" : ""}>
                  Complete Sale
                </button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("searchInput").addEventListener("input", (e) => {
        searchTerm = e.target.value;
        render();
      });

      document.querySelectorAll(".add-to-cart-btn").forEach(btn =>
        btn.addEventListener("click", () => {
          const id = Number(btn.dataset.id);
          const existing = cart.find(c => c.productId === id);
          const product = findProduct(id);
          const currentQtyInCart = existing ? existing.quantitySold : 0;
          if (currentQtyInCart + 1 > product.quantityInStock) {
            Biashara.toast(`Only ${product.quantityInStock} of "${product.name}" in stock.`, "danger");
            return;
          }
          if (existing) existing.quantitySold += 1;
          else cart.push({ productId: id, quantitySold: 1 });
          render();
        }));

      document.querySelectorAll(".qty-btn").forEach(btn =>
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.idx);
          const delta = Number(btn.dataset.delta);
          const item = cart[idx];
          const product = findProduct(item.productId);
          const newQty = item.quantitySold + delta;
          if (newQty <= 0) { cart.splice(idx, 1); render(); return; }
          if (newQty > product.quantityInStock) {
            Biashara.toast(`Only ${product.quantityInStock} in stock.`, "danger");
            return;
          }
          item.quantitySold = newQty;
          render();
        }));

      document.querySelectorAll(".remove-btn").forEach(btn =>
        btn.addEventListener("click", () => {
          cart.splice(Number(btn.dataset.idx), 1);
          render();
        }));

      const completeBtn = document.getElementById("completeSaleBtn");
      if (completeBtn) {
        completeBtn.addEventListener("click", async () => {
          completeBtn.disabled = true;
          try {
            const sale = await BiasharaDB.createSale({ items: cart });
            Biashara.toast(`Sale recorded — ${Biashara.formatKES(sale.total)}`);
            cart = [];
            await loadProducts(); // stock levels changed, refresh them
            render();
          } catch (err) {
            Biashara.toast(err.message, "danger");
            completeBtn.disabled = false;
          }
        });
      }
    }

    (async function () {
      content.innerHTML = `<div class="text-center text-muted py-5">Loading...</div>`;
      try {
        await loadProducts();
      } catch (err) {
        return;
      }
      render();
    })();
    }
  </script>
</body>
</html>
