<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users &middot; Biashara Inventory System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <div class="app-shell" id="appShell"></div>

  <!-- Add User Modal -->
  <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="userForm">
          <div class="modal-header">
            <h5 class="modal-title">Add User</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">Full name</label>
              <input type="text" class="form-control" id="userName" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input type="text" class="form-control" id="userUsername" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="userEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select class="form-select" id="userRole" required>
                <option value="Attendant">Sales Attendant</option>
                <option value="Owner">Owner / Administrator</option>
              </select>
            </div>
            <div class="mb-1">
              <label class="form-label">Temporary password</label>
              <input type="password" class="form-control" id="userPassword" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-biashara" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-biashara">Add user</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const content = Biashara.mountShell({
      active: "users",
      title: "Users",
      subtitle: "Manage who can access the system (Owner only)",
    });

    // mountShell() returns null and redirects to index.html if there's
    // no valid session, so bail out of the rest of this page's script.
    if (!content) {
      // redirecting...
    } else if (BiasharaDB.getCurrentUser().role !== "Owner") {
      // Client-side guard only — this is UX, not security. The real
      // access control is the 'owner' middleware on the Laravel backend,
      // which an Attendant can't bypass by editing the frontend. This
      // just stops an Attendant from landing on a blank/broken page if
      // they type the URL directly instead of using the (hidden) nav link.
      window.location.href = "dashboard.html";
    } else {

    let allUsers = [];

    async function loadUsers() {
      try {
        allUsers = await BiasharaDB.getUsers();
      } catch (err) {
        content.innerHTML = `<div class="empty-state"><div class="icon">&#9888;</div>Could not load users: ${Biashara.escapeHtml(err.message)}</div>`;
        throw err;
      }
    }

    function render() {
      content.innerHTML = `
        <div class="panel">
          <div class="panel-header">
            <h2>All Users (${allUsers.length})</h2>
            <button class="btn btn-amber btn-sm" id="addUserBtn">+ Add User</button>
          </div>
          <div class="panel-body p-0">
            <table class="table-biashara">
              <thead><tr><th>Name</th><th>Username</th><th>Role</th><th></th></tr></thead>
              <tbody>
                ${allUsers.map(u => `
                  <tr>
                    <td>${Biashara.escapeHtml(u.name)}</td>
                    <td>${Biashara.escapeHtml(u.username)}</td>
                    <td><span class="pill ${u.role === 'Owner' ? 'pill-muted' : 'pill-success'}">${u.role}</span></td>
                    <td class="text-end">
                      ${u.id === BiasharaDB.getCurrentUser().id
                        ? `<span class="text-muted small">You</span>`
                        : `<button class="btn btn-sm btn-outline-danger remove-user-btn" data-id="${u.id}">Remove</button>`}
                    </td>
                  </tr>`).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.getElementById("addUserBtn").addEventListener("click", () => userModal.show());
      document.querySelectorAll(".remove-user-btn").forEach(btn =>
        btn.addEventListener("click", async () => {
          const user = allUsers.find(u => u.id === Number(btn.dataset.id));
          if (!user) return;
          if (confirm(`Remove ${user.name} from the system?`)) {
            try {
              await BiasharaDB.deleteUser(user.id);
              Biashara.toast(`${user.name} removed.`, "danger");
              await loadUsers();
              render();
            } catch (err) {
              Biashara.toast(err.message, "danger");
            }
          }
        }));
    }

    const userModal = new bootstrap.Modal(document.getElementById("userModal"));

    document.getElementById("userForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector("button[type=submit]");
      const name = document.getElementById("userName").value.trim();
      const username = document.getElementById("userUsername").value.trim();
      const email = document.getElementById("userEmail").value.trim();
      const password = document.getElementById("userPassword").value;
      const role = document.getElementById("userRole").value;

      submitBtn.disabled = true;
      try {
        await BiasharaDB.addUser({ name, username, email, password, role });
        Biashara.toast(`${name} added as ${role}.`);
        e.target.reset();
        userModal.hide();
        await loadUsers();
        render();
      } catch (err) {
        Biashara.toast(err.message, "danger");
      } finally {
        submitBtn.disabled = false;
      }
    });

    (async function () {
      content.innerHTML = `<div class="text-center text-muted py-5">Loading...</div>`;
      try {
        await loadUsers();
      } catch (err) {
        return;
      }
      render();
    })();
    }
  </script>
</body>
</html>
